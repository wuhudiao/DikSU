[package]
name = "ksud"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log.workspace = true
env_logger = { version = "0.11", default-features = false }
rust-embed = { version = "8", features = [
    "debug-embed",
    "compression", # must clean build after updating binaries
] }
which = "8"
sha1 = "0.11"
base16ct = { version = "1.0", features = ["alloc"] }
sha256 = "1"
tempfile = "3"
chrono = "0.4"
regex-lite = "0.1"
memmap2 = "0.9"
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.9"
# The file manager's chmod/chown are `cfg(unix)` rather than android-only, so this has to be
# available to every non-Windows target (the musl builds in CI included), not just android.
libc = "0.2"
# Same reasoning as `libc`: listing, extracting and adding to a zip has nothing android about
# it, and keeping these behind the android-only gate is what left the archive code compilable
# — and therefore testable — only on a device.
zip = { version = "8", features = [
    "deflate",
    "deflate64",
    "time",
    "lzma",
    "xz",
], default-features = false }
encoding_rs = "0.8"
# The KeyMint panel edits the module's TOML configuration, and a malformed file there
# stops keymint from starting: parsing it here is what turns that into a refusal to save.
toml = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = [
    "all-apis",
] }
android_logger = { version = "0.15", default-features = false }
zip-extensions = { version = "0.14", features = [
    "deflate",
    "lzma",
    "xz",
], default-features = false }
java-properties = { git = "https://github.com/Kernel-SU/java-properties.git", branch = "master", default-features = false }
humansize = "2"
libc = "0.2"
extattr = "1"
jwalk = "0.9"
is_executable = "1"
nom = "8"
derive-new = "0.7"
getopts = "0.2"
ksuinit = { path = "../ksuinit" }
adb_client = { git = "https://github.com/Kernel-SU/adb_client" }
prop-rs-android = { git = "https://github.com/Kernel-SU/ksu_props", rev = "ddb6ee7294467f7f25bad2118e9e24eee104144b" }

[build-dependencies]
bindgen = "0.72"
